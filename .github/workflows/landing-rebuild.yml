name: Dispatch due landing rebuilds

on:
  schedule:
    # Every minute — picks up publish debounce (30s) after process restarts.
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call landing-rebuild cron
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "NEXT_PUBLIC_APP_URL or CRON_SECRET missing — skip"
            exit 0
          fi
          curl -fsS -X POST "${APP_URL%/}/api/cron/landing-rebuild" \
            -H "Authorization: Bearer ${CRON_SECRET}"
