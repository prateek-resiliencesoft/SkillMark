name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: prateek-resiliencesoft/skillmark-app
  VOICE_IMAGE: prateek-resiliencesoft/skillmark-voice

jobs:
  deploy:
    name: Build images · Deploy 5 services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags / public WS URLs
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "app=${REGISTRY}/${APP_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "voice=${REGISTRY}/${VOICE_IMAGE}" >> "$GITHUB_OUTPUT"
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          # http(s)://host → ws(s)://host
          WS_BASE="${APP_URL/https:/wss:}"
          WS_BASE="${WS_BASE/http:/ws:}"
          WS_BASE="${WS_BASE%/}"
          echo "voice_ws=${WS_BASE}/ws/voice" >> "$GITHUB_OUTPUT"
          echo "openai_ws=${WS_BASE}/ws/openai-voice" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.app }}:main
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VOICE_RELAY_URL=${{ steps.meta.outputs.voice_ws }}
            NEXT_PUBLIC_OPENAI_VOICE_RELAY_URL=${{ steps.meta.outputs.openai_ws }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push voice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.voice
          push: true
          tags: |
            ${{ steps.meta.outputs.voice }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.voice }}:main
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          POSTGREST_URL: ${{ secrets.POSTGREST_URL }}
          STORAGE_DIR: ${{ secrets.STORAGE_DIR }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          VOICE_RELAY_PROVIDER: ${{ secrets.VOICE_RELAY_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOUBAO_APP_ID: ${{ secrets.DOUBAO_APP_ID }}
          DOUBAO_ACCESS_TOKEN: ${{ secrets.DOUBAO_ACCESS_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,AUTH_SECRET,NEXT_PUBLIC_APP_URL,POSTGREST_URL,STORAGE_DIR,SITE_ADDRESS,VOICE_RELAY_PROVIDER,GEMINI_API_KEY,OPENAI_API_KEY,DOUBAO_APP_ID,DOUBAO_ACCESS_TOKEN,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_API_KEY
          script: |
            set -euo pipefail
            cd /opt/skillmark

            git fetch origin main
            git reset --hard origin/main

            # Stop leftover host services only (do NOT pkill -f — it matches this SSH script and kills the deploy)
            sudo systemctl stop caddy 2>/dev/null || true
            sudo systemctl disable caddy 2>/dev/null || true
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop all 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
              pm2 save --force 2>/dev/null || true
            fi
            # Ports 80/3000 may already be held by our Docker stack — that is OK; compose recreate handles it.

            umask 077
            cat > .env <<EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_PORT=5433
            POSTGREST_PORT=3001
            POSTGREST_URL=${POSTGREST_URL}
            AUTH_SECRET=${AUTH_SECRET}
            NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
            STORAGE_DIR=${STORAGE_DIR}
            SITE_ADDRESS=${SITE_ADDRESS:-:80}
            VOICE_RELAY_PROVIDER=${VOICE_RELAY_PROVIDER:-auto}
            GEMINI_API_KEY=${GEMINI_API_KEY:-}
            OPENAI_API_KEY=${OPENAI_API_KEY:-}
            DOUBAO_APP_ID=${DOUBAO_APP_ID:-}
            DOUBAO_ACCESS_TOKEN=${DOUBAO_ACCESS_TOKEN:-}
            AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
            AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
            EOF

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate app voice caddy
            docker compose -f docker-compose.prod.yml up -d

            docker compose -f docker-compose.prod.yml ps
            sleep 5
            curl -fsS -o /dev/null -w "caddy:%{http_code}\n" http://127.0.0.1/login || true
            curl -fsS -o /dev/null -w "app:%{http_code}\n" http://127.0.0.1:3000/login || true
