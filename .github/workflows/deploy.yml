name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: prateek-resiliencesoft/skillmark-app
  VOICE_IMAGE: prateek-resiliencesoft/skillmark-voice

jobs:
  deploy:
    name: Build images · Deploy 5 services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags / public WS URLs
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "app=${REGISTRY}/${APP_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "voice=${REGISTRY}/${VOICE_IMAGE}" >> "$GITHUB_OUTPUT"
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          # http(s)://host → ws(s)://host
          WS_BASE="${APP_URL/https:/wss:}"
          WS_BASE="${WS_BASE/http:/ws:}"
          WS_BASE="${WS_BASE%/}"
          echo "voice_ws=${WS_BASE}/ws/voice" >> "$GITHUB_OUTPUT"
          echo "openai_ws=${WS_BASE}/ws/openai-voice" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.app }}:main
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VOICE_RELAY_URL=${{ steps.meta.outputs.voice_ws }}
            NEXT_PUBLIC_OPENAI_VOICE_RELAY_URL=${{ steps.meta.outputs.openai_ws }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push voice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.voice
          push: true
          tags: |
            ${{ steps.meta.outputs.voice }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.voice }}:main
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          POSTGREST_URL: ${{ secrets.POSTGREST_URL }}
          STORAGE_DIR: ${{ secrets.STORAGE_DIR }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          VOICE_RELAY_PROVIDER: ${{ secrets.VOICE_RELAY_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE_RUNNER_API_KEY: ${{ secrets.CODE_RUNNER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOUBAO_APP_ID: ${{ secrets.DOUBAO_APP_ID }}
          DOUBAO_ACCESS_TOKEN: ${{ secrets.DOUBAO_ACCESS_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_LOKI_DATASOURCE_UID: ${{ secrets.GRAFANA_LOKI_DATASOURCE_UID }}
          GRAFANA_LOG_INSTANCE: ${{ secrets.GRAFANA_LOG_INSTANCE }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          ROUND2_AGENT_SECRET: ${{ secrets.ROUND2_AGENT_SECRET }}
          ROUND2_STT_API_KEY: ${{ secrets.ROUND2_STT_API_KEY }}
          ROUND2_STT_BASE_URL: ${{ secrets.ROUND2_STT_BASE_URL }}
          ROUND2_STT_MODEL: ${{ secrets.ROUND2_STT_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LANGFUSE_SERVER_SECRET: ${{ secrets.LANGFUSE_SERVER_SECRET }}
          LANGFUSE_DOMAIN: ${{ secrets.LANGFUSE_DOMAIN }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_URL: ${{ secrets.LANGFUSE_PUBLIC_URL }}
          LANGFUSE_PROJECT_ID: ${{ secrets.LANGFUSE_PROJECT_ID }}
          LANGFUSE_INIT_USER_EMAIL: ${{ secrets.LANGFUSE_INIT_USER_EMAIL }}
          LANGFUSE_INIT_USER_PASSWORD: ${{ secrets.LANGFUSE_INIT_USER_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,AUTH_SECRET,NEXT_PUBLIC_APP_URL,POSTGREST_URL,STORAGE_DIR,CRON_SECRET,SITE_ADDRESS,VOICE_RELAY_PROVIDER,GEMINI_API_KEY,CODE_RUNNER_API_KEY,OPENAI_API_KEY,DOUBAO_APP_ID,DOUBAO_ACCESS_TOKEN,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_API_KEY,GRAFANA_URL,GRAFANA_SERVICE_ACCOUNT_TOKEN,GRAFANA_LOKI_DATASOURCE_UID,GRAFANA_LOG_INSTANCE,UPTIMEROBOT_API_KEY,LIVEKIT_URL,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,ROUND2_AGENT_SECRET,ROUND2_STT_API_KEY,ROUND2_STT_BASE_URL,ROUND2_STT_MODEL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,LANGFUSE_SERVER_SECRET,LANGFUSE_DOMAIN,LANGFUSE_PUBLIC_KEY,LANGFUSE_SECRET_KEY,LANGFUSE_BASE_URL,LANGFUSE_PUBLIC_URL,LANGFUSE_PROJECT_ID,LANGFUSE_INIT_USER_EMAIL,LANGFUSE_INIT_USER_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/skillmark

            git fetch origin main
            git reset --hard origin/main

            # Stop leftover host services only (do NOT pkill -f — it matches this SSH script and kills the deploy)
            sudo systemctl stop caddy 2>/dev/null || true
            sudo systemctl disable caddy 2>/dev/null || true
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop all 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
              pm2 save --force 2>/dev/null || true
            fi
            # Ports 80/3000 may already be held by our Docker stack — that is OK; compose recreate handles it.

            chmod +x scripts/write-deploy-env.sh
            ./scripts/write-deploy-env.sh

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export IMAGE_TAG
            DC="docker compose -f docker-compose.prod.yml -f docker-compose.langfuse.yml"

            # Large layers (voice node_modules ~700MB) occasionally fail to extract
            # on the host ("failed to Lchown ... no such file or directory").
            # Pull the big images one at a time, quietly, and retry.
            df -h / /var/lib/containerd /var/lib/docker 2>/dev/null || true
            pulled=0
            for attempt in 1 2 3; do
              if $DC pull --quiet voice && $DC pull --quiet app && $DC pull --quiet; then
                pulled=1
                break
              fi
              echo "docker compose pull failed (attempt ${attempt}/3); retrying in 20s" >&2
              sleep 20
            done
            if [ "$pulled" != 1 ]; then
              echo "docker compose pull failed after 3 attempts" >&2
              df -h / /var/lib/containerd /var/lib/docker 2>/dev/null || true
              df -i / 2>/dev/null || true
              exit 1
            fi

            # --force-recreate fails with "No such container" when the daemon
            # already lost a service (common for voice after a bad prior deploy).
            # Stop+rm those services first, then a plain up creates them clean.
            for svc in app voice caddy rest; do
              $DC stop "$svc" 2>/dev/null || true
              $DC rm -f "$svc" 2>/dev/null || true
            done
            # Clear any dangling containers compose still thinks exist.
            docker ps -aq --filter "name=skillmark-voice" | xargs -r docker rm -f 2>/dev/null || true

            $DC up -d --remove-orphans
            # Media lives on this volume; the app runs as nextjs and must be able to write it.
            $DC exec -T -u root app chown -R nextjs:nodejs /app/storage || true

            # Wait for Postgres, then apply idempotent db/init migrations (02+).
            # docker-entrypoint-initdb.d only runs on a brand-new volume.
            for _ in $(seq 1 40); do
              st="$(docker inspect -f '{{.State.Health.Status}}' "$($DC ps -q db)" 2>/dev/null || echo missing)"
              [ "$st" = healthy ] && break
              sleep 3
            done
            chmod +x scripts/db-migrate.sh
            POSTGRES_USER="${POSTGRES_USER}" POSTGRES_DB="${POSTGRES_DB}" \
              ./scripts/db-migrate.sh docker-compose.prod.yml

            # Old app/voice tags only. Volumes (Postgres, uploads, Caddy) stay.
            chmod +x scripts/prune-deploy-images.sh
            ./scripts/prune-deploy-images.sh

            $DC ps
            sleep 5
            curl -fsS -o /dev/null -w "caddy:%{http_code}\n" http://127.0.0.1/login || true
            curl -fsS -o /dev/null -w "app:%{http_code}\n" http://127.0.0.1:3000/login || true
